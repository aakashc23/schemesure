name: CI/CD

# Tests run on every push and pull request. Deployment runs only for pushes to
# main that pass the tests — a red test suite can never reach the live Space.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # A newer push supersedes an in-flight run, so two deploys never race.
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # The corpus contains Devanagari and the rupee sign; without this, printing
  # scheme text fails on some runner locales.
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: Validate data and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only torch)
        # The default Linux torch wheel is the ~2.5 GB CUDA build. There is no GPU
        # here, so install from the CPU index first; the requirements install then
        # finds torch already satisfied.
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache the embedding model
        # ~120 MB from the HF Hub. Cached so later runs do not re-download it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Validate the scheme data
        # Runs first: if the corpus is malformed, every test failure after this
        # would be a confusing symptom of the same root cause.
        run: python scripts/validate_data.py

      - name: Build the Chroma index
        # The integration tests exercise real retrieval, so they need a real
        # index. This also re-checks that no chunk exceeds the token budget.
        run: python -m core.ingest

      - name: Run the test suite
        # No API key is configured here, and none is needed: every test replaces
        # the LLM with a fake. The suite makes no network calls.
        run: python -m pytest -v

      - name: Scan for leaked credentials
        run: python scripts/scan_secrets.py --tracked

  # ---------------------------------------------------------------------------
  # The container is the production deployment shape, so CI proves it actually
  # builds and serves. Without this the Dockerfile is an untested claim — and it
  # is the one artifact that cannot be checked by the unit tests, since it is
  # where the index build, the CPU-torch install and the two-process startup all
  # come together.
  #
  # No API key is needed: the app boots in a degraded state and /health reports
  # `llm_key_configured: false`, which is exactly the behaviour being verified.
  # ---------------------------------------------------------------------------
  docker:
    name: Build and smoke-test the container
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        # This also exercises the build-time index build, so a malformed corpus
        # or an over-budget chunk fails here rather than in production.
        run: docker build -t schemesure:ci .

      - name: Start the container
        run: |
          docker run -d --name schemesure -p 7860:7860 schemesure:ci
          echo "waiting for the container to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7860/_stcore/health >/dev/null 2>&1; then
              echo "Streamlit is serving after ~$((i*5))s"
              exit 0
            fi
            if ! docker ps --filter name=schemesure --filter status=running -q | grep -q .; then
              echo "::error::the container exited during startup"
              docker logs schemesure
              exit 1
            fi
            sleep 5
          done
          echo "::error::the container did not become healthy within 300s"
          docker logs schemesure
          exit 1

      - name: Check the internal API is up and the index is populated
        run: |
          # FastAPI is bound to 127.0.0.1 inside the container and is never
          # published, so this check runs from inside it.
          docker exec schemesure curl -sf http://127.0.0.1:8000/health > health.json
          cat health.json
          docker exec schemesure curl -sf http://127.0.0.1:8000/schemes > schemes.json
          python - <<'PY'
          import json

          health = json.load(open("health.json"))
          assert health["schemes_loaded"] == 15, f"expected 15 schemes, got {health['schemes_loaded']}"
          assert health["chunks_indexed"] > 300, f"index looks empty: {health['chunks_indexed']} chunks"
          print(f"OK: {health['schemes_loaded']} schemes, "
                f"{health['chunks_indexed']} chunks indexed at build time")

          # /schemes must serve real data even with no LLM key configured.
          schemes = json.load(open("schemes.json"))
          assert len(schemes) == 15, f"/schemes returned {len(schemes)}"
          assert all(".gov.in" in s["source_url"] for s in schemes), "a source_url is not official"
          print(f"OK: /schemes returned {len(schemes)} schemes, all citing .gov.in sources")
          PY

      - name: Container logs
        if: always()
        run: docker logs schemesure

      - name: Stop the container
        if: always()
        run: docker rm -f schemesure || true

  # ---------------------------------------------------------------------------
  # Deployment
  #
  # The live demo runs on Streamlit Community Cloud, which watches this repo and
  # redeploys itself on every push to main — so the normal deploy path needs no
  # job here. Worth being honest about the consequence: Streamlit Cloud rebuilds
  # on push regardless of whether this test job passed. The gate that *does*
  # hold is the branch: tests run on every pull request, so a change should not
  # reach main red in the first place.
  #
  # This job keeps the Hugging Face path working for anyone with a PRO
  # subscription (Docker Spaces are no longer free), and for a Cloud Run or
  # self-hosted deployment of the same image. It is manual-only — on a free
  # account the Spaces API returns 402, and failing every push would train
  # everyone to ignore a red tick.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Hugging Face Space (manual, needs PRO)
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deployment dependencies
        # Deliberately minimal: the deploy script only uploads files and reads
        # settings, so it needs neither torch nor chromadb.
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub==1.33.0" "pydantic-settings==2.15.0" \
                      "python-dotenv==1.2.4" "requests==2.34.2"

      - name: Deploy
        # Secrets come from the repository's GitHub Secrets. There is no .env in
        # CI; pydantic-settings reads these environment variables instead.
        # deploy_hf.py forwards the LLM values to the Space as *Space secrets*,
        # so they are never written into an uploaded file.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/deploy_hf.py
